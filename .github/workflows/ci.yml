name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Copilot coding agent 提交的 PR 会被 GitHub 打成 action_required（要人工点
      # Approve 才跑 workflow），自动修复就断在「验证」这一步。push 事件没有这道
      # 闸门，所以让 copilot/** 的 push 直接跑同一条 verify。
      - 'copilot/**'
    # 台账自动提交只动 ledger/（改不了代码），跳过以免 Actions 列表被「记进展」刷屏；
    # 代码或混合提交照常触发，Release workflow（tag 触发）不受影响。
    paths-ignore:
      - 'ledger/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (check, lint, format, tests, gates, canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 历史递增门禁需要完整历史（HOST_REV/PANEL_BUILD/REV 三契约）
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run verify
      # 生成完整评分报告（写入 docs/ai-native-health-report.md 并上传为 artifact，
      # PR 页面可下载），同时按地板分 80 设闸；gate 不达标时上一步已红，报告照传
      - name: AI-Native maturity floor
        run: npm run assess -- --write-docs --min-score 80
      - name: Upload AI-Native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-health-report
          path: docs/ai-native-health-report.md

  mutation:
    name: Scorer mutation test (评分器的评分器)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # 15 个变异逐个打坏控制项，评分必须下降；判据退化成「读关键词」即红
      - name: Mutation test
        run: npm run mutate

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: E2E
        run: npm run test:e2e

  manifest:
    name: Plugin manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json is valid JSON with a name and version
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name+'@'+p.version)"
      - name: cordis.patch.yml references the package name
        run: grep -q "dsh-annotator" cordis.patch.yml
      - name: Exports referenced by the bundle exist
        run: node -e "import('./lib/index.js').then(m=>{if(typeof m.apply!=='function'||m.name!=='dsh-annotator')process.exit(1);console.log('exports ok')})"
