name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Copilot coding agent 提交的 PR 会被 GitHub 打成 action_required（要人工点
      # Approve 才跑 workflow），自动修复就断在「验证」这一步。push 事件没有这道
      # 闸门，所以让 copilot/** 的 push 直接跑同一条 verify。
      - 'copilot/**'
    # 台账自动提交只动 ledger/（改不了代码），跳过以免 Actions 列表被「记进展」刷屏；
    # 代码或混合提交照常触发，Release workflow（tag 触发）不受影响。
    paths-ignore:
      - 'ledger/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 完整门径只在 Linux 上跑：check/lint/format/gates/canary 依赖 POSIX 工具链，
  # 换成 Windows 只会把「平台差异」混进「代码问题」里。平台覆盖交给下面的
  # 单测与浏览器矩阵——那才是真正会因平台不同的部分。
  verify:
    name: Verify (check, lint, format, tests, gates, canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 历史递增门禁需要完整历史（HOST_REV/PANEL_BUILD/REV 三契约）
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run verify
      # 生成完整评分报告（写入 docs/ai-native-health-report.md 并上传为 artifact，
      # PR 页面可下载），同时按地板分 80 设闸；gate 不达标时上一步已红，报告照传
      - name: AI-Native maturity floor
        run: npm run assess -- --write-docs --min-score 80
      - name: Upload AI-Native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-health-report
          path: docs/ai-native-health-report.md

  # 单元测试是纯 Node（不起浏览器），但要吃平台的路径/大小写/换行差异，
  # 所以两个平台的系统盘上各跑一遍。需要完整历史：三契约门禁要看 git 提交顺序。
  unit-windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test

  unit-macos:
    name: Unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test

  # 真浏览器端到端：三个平台各一台，Chrome 与 Edge 都必须真的起来。
  #
  # 为什么不用 strategy.matrix 一把梭：分支保护的必需检查按 job 显示名比对，
  # gate-doctor 是静态扫描 workflow 文本；matrix 展开出来的名字是运行时拼的，
  # 静态校验对不上（写死还会被 `#` 行内注释陷阱坑一次）。所以三个平台各写一个
  # caller job——它们只负责传 runner 与名字，步骤全在 browser-e2e.yml 里。
  e2e-linux:
    name: Browser e2e (Linux)
    uses: ./.github/workflows/browser-e2e.yml
    with:
      runner: ubuntu-latest
      browsers: chrome,edge

  e2e-windows:
    name: Browser e2e (Windows)
    uses: ./.github/workflows/browser-e2e.yml
    with:
      runner: windows-latest
      browsers: chrome,edge

  e2e-macos:
    name: Browser e2e (macOS)
    uses: ./.github/workflows/browser-e2e.yml
    with:
      runner: macos-latest
      browsers: chrome,edge

  mutation:
    name: Scorer mutation test (评分器的评分器)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # 15 个变异逐个打坏控制项，评分必须下降；判据退化成「读关键词」即红
      - name: Mutation test
        run: npm run mutate

  manifest:
    name: Plugin manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json is valid JSON with a name and version
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name+'@'+p.version)"
      - name: cordis.patch.yml references the package name
        run: grep -q "dsh-annotator" cordis.patch.yml
      - name: Exports referenced by the bundle exist
        run: node -e "import('./lib/index.js').then(m=>{if(typeof m.apply!=='function'||m.name!=='dsh-annotator')process.exit(1);console.log('exports ok')})"
