name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, syntax check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Format check
        run: npm run format:check

  manifest:
    name: Plugin manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json is valid JSON with a name and version
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name+'@'+p.version)"
      - name: cordis.patch.yml references the package name
        run: grep -q "dsh-visual-annotator" cordis.patch.yml
      - name: Exports referenced by the bundle exist
        run: node -e "import('./lib/index.js').then(m=>{if(typeof m.apply!=='function'||m.name!=='dsh-visual-annotator')process.exit(1);console.log('exports ok')})"
