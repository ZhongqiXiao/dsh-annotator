name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # 台账自动提交只动 ledger/（改不了代码），跳过以免 Actions 列表被「记进展」刷屏；
    # 代码或混合提交照常触发，Release workflow（tag 触发）不受影响。
    paths-ignore:
      - 'ledger/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (check, lint, format, tests, gates, canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 历史递增门禁需要完整历史（HOST_REV/PANEL_BUILD/REV 三契约）
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run verify

  e2e:
    name: Browser e2e (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: E2E
        run: npm run test:e2e

  manifest:
    name: Plugin manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json is valid JSON with a name and version
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name+'@'+p.version)"
      - name: cordis.patch.yml references the package name
        run: grep -q "dsh-visual-annotator" cordis.patch.yml
      - name: Exports referenced by the bundle exist
        run: node -e "import('./lib/index.js').then(m=>{if(typeof m.apply!=='function'||m.name!=='dsh-visual-annotator')process.exit(1);console.log('exports ok')})"
