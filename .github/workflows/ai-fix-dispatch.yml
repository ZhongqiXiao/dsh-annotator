name: AI fix dispatch

# ai-fix 标签即派单触发：把 issue 指派给 Copilot coding agent，由它开分支、写代码、开 Draft PR。
# 一次性配置（repo 启用 coding agent + COPILOT_ASSIGN_TOKEN secret + 创建 ai-fix 标签）见 docs/AI-FIX.md。
on:
  issues:
    types: [labeled]

permissions:
  issues: write

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign-copilot:
    name: Assign issue to Copilot coding agent
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    steps:
      # 环境配置缺失要报成环境配置缺失：secret 为空时 gh 会抛一句无关的「set GH_TOKEN」，
      # 排查的人会去翻权限配置而不是补 secret（issue #2）。
      - name: Preflight — 派单凭据是否就位
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::COPILOT_ASSIGN_TOKEN 未配置：拿不到有 Copilot 许可的凭据，无法把 issue 派给 Copilot coding agent。按 docs/AI-FIX.md 配好该 secret 后重新打 ai-fix 标签；不打算用自动派单就删掉本 workflow。"
            exit 1
          fi

      - name: Look up the Copilot actor and assign it
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          COPILOT_ID="$(gh api graphql \
            -H 'GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection' \
            -f query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){assignableUsers(first:100){nodes{__typename login id}}}}' \
            -f owner="$OWNER" -f repo="$REPO" \
            --jq '.data.repository.assignableUsers.nodes[] | select(.__typename=="Bot" and (.login|test("copilot";"i"))) | .id' | head -n1)"
          if [ -z "$COPILOT_ID" ]; then
            echo "::error::assignableUsers 里没有 Copilot 机器人：请先在仓库 Settings 启用 Copilot coding agent，并确认 COPILOT_ASSIGN_TOKEN 来自有 Copilot 许可的账号（见 docs/AI-FIX.md）。"
            exit 1
          fi
          gh api graphql \
            -H 'GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection' \
            -f query='mutation($assignable:ID!,$copilot:ID!){assignCopilotToAssignable(input:{assignableId:$assignable,copilotId:$copilot}){assignable{__typename}}}' \
            -f assignable="$ISSUE_ID" -f copilot="$COPILOT_ID"
          # 派单成功与否只能看结果：仓库没启用 coding agent 时，GitHub 会「接受」
          # mutation 却一个 assignee 都不落（实测 addAssigneesToAssignable 返回空数组），
          # 不核验就会把「没派出去」报成派单成功。
          ASSIGNEES="$(gh api graphql \
            -H 'GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection' \
            -f query='query($id:ID!){node(id:$id){... on Issue {assignees(first:20){nodes{login}}}}}' \
            -f id="$ISSUE_ID" --jq '[.data.node.assignees.nodes[].login] | join(",")')"
          if ! printf '%s' "$ASSIGNEES" | grep -qi 'copilot'; then
            echo "::error::派单没有落地（当前 assignees: '${ASSIGNEES}'）：最常见的原因是仓库还没启用 Copilot coding agent——GitHub 会接受 mutation 但一个 assignee 都不加。见 docs/AI-FIX.md 的「排障」。"
            exit 1
          fi
          echo "已把 issue 指派给 Copilot coding agent（assignees: $ASSIGNEES）；稍后会出现 copilot/* 分支与 Draft PR（首个 PR 需要一次人工批准）。"
