name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Version guard passed: $PKG_VERSION"

  check:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 历史递增门禁需要完整历史：build-sync 在 CI 浅克隆下按设计判红（canary 防假绿），
        # check job 自己必须先拿全量历史才能过这道门
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Manifest integrity
        run: grep -q "dsh-annotator" cordis.patch.yml

  publish:
    needs: [guard, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination ./dist
          VERSIONED="$(ls dist/*.tgz | head -n1)"
          # 先落盘再 grep：grep -q 命中即退出，会让 tar 收到 SIGPIPE(141)，pipefail 下被误判为失败
          tar -tzf "$VERSIONED" > listing.txt
          grep -qx 'package/lib/index.js' listing.txt || {
            echo "::error::npm pack 产物缺少 package/lib/index.js（files 字段或到包丢失？）"
            exit 1
          }
          # 额外产出不带版本号的资产名：市场列表用它拼
          # releases/latest/download/<无版本名>.tgz —— 带版本号的文件名
          # 在 latest 链接里解析到的仍是旧版本，下一次发版就会 404。
          cp "$VERSIONED" dist/dsh-annotator.tgz
          # 旧包名 dsh-visual-annotator 的兼容副本：官方市场条目仍写死旧名，
          # 少这份会让老链接 404；两个名字装到的是同一个包
          cp "$VERSIONED" dist/dsh-visual-annotator.tgz
          # 三份必须字节一致：否则市场按无版本名装到的和 Release 里挂的不是同一个包
          [ "$(sha256sum "$VERSIONED" | cut -d' ' -f1)" = "$(sha256sum dist/dsh-annotator.tgz | cut -d' ' -f1)" ]
          [ "$(sha256sum "$VERSIONED" | cut -d' ' -f1)" = "$(sha256sum dist/dsh-visual-annotator.tgz | cut -d' ' -f1)" ]
          echo "Packed: $(ls dist)"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 重跑时 release 已存在，直接补传资产（--clobber），否则 gh 会报 already exists 而卡住修复
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Verify market tarball is reachable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          # 市场条目把 URL 写死成 releases/latest/download/<无版本名>：
          # 资产名少一个字符、或 latest 指向别的 release，都是静默 404，
          # 只有真的下载一次才能证明这个链接可用。
          gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json assets --jq '.assets[].name' | tee assets.txt
          for ASSET in dsh-annotator.tgz dsh-visual-annotator.tgz; do
            grep -qx "$ASSET" assets.txt || {
              echo "::error::release $GITHUB_REF_NAME 缺少无版本号资产 $ASSET"
              exit 1
            }
            URL="https://github.com/$REPO/releases/latest/download/$ASSET"
            # latest 的重定向在 release 刚建好时可能还没生效，重试几次再判失败
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "$URL" -o market.tgz && [ -s market.tgz ]; then
                break
              fi
              echo "attempt $attempt: $URL 尚未就绪，5s 后重试"
              sleep 5
            done
            test -s market.tgz || { echo "::error::$URL 下载不到内容"; exit 1; }
            tar -tzf market.tgz > listing.txt
            grep -qx 'package/lib/index.js' listing.txt || {
              echo "::error::$URL 下载到的不是有效插件包（缺少 package/lib/index.js）"
              exit 1
            }
            echo "OK: $URL 可下载且是有效包"
          done
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret not configured; skipping npm publish (GitHub Release still created)"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish
