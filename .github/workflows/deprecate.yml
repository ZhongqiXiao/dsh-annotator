name: Deprecate old npm name

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    name: Mark dsh-visual-annotator as renamed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate old package name
        run: >-
          npm deprecate dsh-visual-annotator@0.5.3
          "Renamed to dsh-annotator — install dsh-annotator@^0.5.4 for updates.
          The old name stays installable for compatibility."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
